<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>WebSocket Chat (Module 06)</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 20px; }
        #log { border: 1px solid #ccc; padding: 10px; height: 320px; overflow-y: auto; background: #f9f9f9; }
        #log div { padding: 2px 0; }
        #log .system { color: #888; font-style: italic; }
        input { width: 80%; padding: 8px; }
        button { padding: 8px 16px; }
    </style>
</head>
<body>
    <h1>WebSocket Chat</h1>
    <p>服务端：<code>localhost:9099</code> · 路径：<code>/ws</code></p>

    <div id="status">未连接</div>
    <div id="log"></div>
    <input id="input" type="text" placeholder="输入消息后回车发送" autocomplete="off" />
    <button id="btn-send">发送</button>
    <button id="btn-close">断开</button>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        const input = document.getElementById('input');
        const btnSend = document.getElementById('btn-send');
        const btnClose = document.getElementById('btn-close');
        let ws = null;

        function append(text, isSystem) {
            const div = document.createElement('div');
            if (isSystem) div.className = 'system';
            div.textContent = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function connect() {
            ws = new WebSocket('ws://' + location.hostname + ':9099/ws');
            ws.onopen = () => { status.textContent = '已连接'; append('--- connected ---', true); };
            ws.onclose = () => { status.textContent = '未连接'; append('--- disconnected ---', true); };
            ws.onerror = (e) => { append('[error] ' + e, true); };
            ws.onmessage = (e) => { append(e.data); };
        }

        function send() {
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== 1) return;
            ws.send(text);
            input.value = '';
        }

        btnSend.addEventListener('click', send);
        btnClose.addEventListener('click', () => { if (ws) ws.close(); });
        input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

        connect();
    </script>
</body>
</html>
